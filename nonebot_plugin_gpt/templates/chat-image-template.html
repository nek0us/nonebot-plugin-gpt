<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #f6f7fb; color: #26334d; font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .sheet { width: 760px; padding: 28px; }
    .message { padding: 26px; border-radius: 14px; background: #ffffff; box-shadow: 0 6px 22px rgba(67, 76, 108, .08); }
    .content { font-size: 17px; line-height: 1.78; overflow-wrap: anywhere; }
    h1 { padding-left: 14px; border-left: 6px solid #8a72d6; }
    h2 { padding-left: 11px; border-left: 5px solid #79a9dc; }
    h3 { padding-left: 9px; border-left: 4px solid #e58ab0; }
    pre { padding: 14px; overflow-x: auto; border-radius: 10px; background: #293449; color: #edf2ff; }
    code { padding: 2px 5px; border-radius: 4px; background: #f2f4f8; }
    pre code { padding: 0; background: transparent; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 9px 11px; border: 1px solid #e0e4ee; text-align: left; }
    th { background: #eee9ff; color: #5d4aa3; }
    img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <main class="sheet"><article class="message"><div class="content">{{ content }}</div></article></main>
</body>
</html>
